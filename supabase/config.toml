# OrGanap Supabase Configuration
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "organap"

[api]
enabled = true
port = 54351
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54352
shadow_port = 54350
major_version = 15

[db.pooler]
enabled = false
port = 54359

[realtime]
enabled = true

[studio]
enabled = true
port = 54353
api_url = "http://127.0.0.1:54351"

[local_smtp]
enabled = true
port = 54354

[analytics]
enabled = false
port = 54357

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.organap-assets]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml", "application/pdf", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000", "http://localhost:3000/**", "http://127.0.0.1:3000/**", "https://organap.vercel.app", "https://organap.vercel.app/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
